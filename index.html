          var proto = typeof Window !== 'undefined' ? Window.prototype : Object.getPrototypeOf(window);
          var protoDesc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
          for (var i = 0; i < targets.length; i++) {
            var t = targets[i];
            var ownDesc = Object.getOwnPropertyDescriptor(t, 'fetch');
            var desc = ownDesc || protoDesc;
            if (desc && desc.get && !desc.set && (!ownDesc || ownDesc.configurable)) {
              var nativeFetch = window.fetch.bind(window);
              Object.defineProperty(t, 'fetch', {
                value: nativeFetch,
                writable: true,
                configurable: true,

              });
            }
          }
          var isExtensionSource = function (str) {
            return typeof str === 'string' && (str.indexOf('chrome-extension://') !== -1 || str.indexOf('moz-extension://') !== -1);
          };
          window.addEventListener(
            'error',
            function (ev) {
              var stack = ev && ev.error && ev.error.stack ? String(ev.error.stack) : '';
              if (ev && (isExtensionSource(ev.filename) || isExtensionSource(stack))) {
                ev.preventDefault();
                ev.stopImmediatePropagation();
              }
            },
            true
          );
          window.addEventListener(
            'unhandledrejection',
            function (ev) {
              var reason = ev && ev.reason;
              var stack = reason && reason.stack ? String(reason.stack) : String(reason || '');
              if (isExtensionSource(stack)) {
                ev.preventDefault();
                ev.stopImmediatePropagation();
              }
            },
            true
          );
        } catch (_e) {}
      })();
