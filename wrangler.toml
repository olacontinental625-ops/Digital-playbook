name = "digital-logbook-api"
main = "worker/src/index.ts"
compatibility_date = "2026-01-01"

[triggers]
# Daily expiry check at 08:00 UTC + Monthly report check
crons = ["0 8 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "digital-logbook-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Non-secret default currency; override in Cloudflare Dashboard if desired
DEFAULT_CURRENCY_SYMBOL = "$"
DEFAULT_CURRENCY_CODE = "USD"

# Secrets to configure with `wrangler secret put`:
# - ONESIGNAL_APP_ID
# - ONESIGNAL_REST_API_KEY
# - ALLOWED_ORIGIN (your Cloudflare Pages URL, e.g. https://digital-logbook.pages.dev)
